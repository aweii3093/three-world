<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>work</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: rgba(245, 246, 241, 0.9);
      background: #858ba0;
      overflow: hidden;
    }

    .page {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: -24px;
      z-index: -2;
      background-image: url("assets/expanded-art-bg.png");
      background-position: center;
      background-size: cover;
      filter: blur(10px) saturate(0.9);
      transform: scale(1.04);
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(9, 10, 14, 0.32);
    }

    .back-link {
      position: fixed;
      left: clamp(16px, 3vw, 38px);
      top: clamp(16px, 3vw, 38px);
      z-index: 2;
      min-height: 36px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(245, 246, 241, 0.5);
      border-radius: 999px;
      color: rgba(245, 246, 241, 0.9);
      background: rgba(8, 8, 11, 0.36);
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="aweii-entry-v3.html">返回</a>
  </main>
</body>
</html>
